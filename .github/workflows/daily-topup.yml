name: AI Hourly
on:
  schedule:
    - cron: '23 * * * *' # Every hour at :23 UTC / Asia/Shanghai; delays are possible
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ai-daily-pages
  cancel-in-progress: false
jobs:
  topup:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: master # Queued jobs read current history after obtaining the shared lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Verify daily pipeline
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Find interesting new AI items within a fixed budget
        timeout-minutes: 4
        env:
          DAILY_SITE_URL: ${{ vars.DAILY_SITE_URL }}
        run: python -u scripts/daily.py --hourly
      - name: Preserve edition and deduplication history
        run: |
          git config user.name 'AI Daily'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish hourly AI notes"
            git push origin HEAD:master # Fast-forward only; never overwrite concurrent changes
          fi
      - uses: actions/configure-pages@v5
      - name: Package only public website files
        env:
          ANALYTICS_SNIPPET: ${{ vars.ANALYTICS_SNIPPET }}
        run: python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
